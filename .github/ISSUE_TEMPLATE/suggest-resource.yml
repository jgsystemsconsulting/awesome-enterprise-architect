name: Suggest a resource
description: Suggest a Sparx Systems Enterprise Architect resource to add to the list
title: "[Suggestion] <resource name>"
labels: ["suggestion"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
      placeholder: e.g. Enterprise Architect Toolpack
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description (≤ 140 characters, factual, no hype)
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Which section does it belong in?
      options:
        - Official product and docs
        - Add-ins and MDG technologies
        - Scripting, API, and automation
        - Tutorials and courses
        - Books and papers
        - Sample models
        - Community and forums
    validations:
      required: true
  - type: checkboxes
    id: bar
    attributes:
      label: Inclusion bar (see CONTRIBUTING.md)
      options:
        - label: On-topic for Sparx Systems Enterprise Architect (the modeling product; not general TOGAF/ArchiMate EA)
          required: true
        - label: Substantive (teaches/demonstrates/specifies/provides something usable, not pure marketing)
          required: true
        - label: The link is live right now
          required: true
        - label: It isn't already in the list (canonical-URL rule, CONTRIBUTING.md)
          required: true
        - label: Publicly accessible (we link, we never re-host); not a banned host
          required: true
